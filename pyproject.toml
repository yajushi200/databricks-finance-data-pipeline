[project]
name = "fraud-detection-lakehouse"
version = "0.1.0"
description = "Fraud detection data pipeline on Databricks Free Edition"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
